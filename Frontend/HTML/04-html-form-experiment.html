<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta "description" content="this website contains sign up page for our company">
    <title>sign up</title>
    <style>
       body{
        background:rgb(61, 41, 41) url(image.jpg.jpg)no-repeat fixed;
       }
       .oneoone {
        text-align: center;
       }
       h4{
        color: rgba(92, 75, 55, 0.627);
        letter-spacing: 15px;
       }
       section{
        font-size: large;
        background-color: rgba(255, 248, 220, 0.201);
        text-align: center;
        border: 5px solid rgba(249, 148, 16, 0.419);
        border-radius: 8px ;
        width: 60vmin;
        margin: 20px auto ;
        height: 50vh;
        }
        h1{
            color: rgb(59, 67, 41);
        }
        .two, .three, .four{
            margin: 15px;
        }
        .five{
            background-color: bisque;
            border: 2px solid rgba(57, 47, 47, 0.459) ;
            border-radius: 5px;
            width: 13vmin;
            margin: auto;
            margin-top: 15px;
        }
        .six_one, .six_two{
            color: bisque ;
            background-color: darkolivegreen;
            border: 2px solid  rgb(57, 40, 40) ;
            border-radius: 5px;
            padding:10px ;
            margin: auto;

        }
        .roundtwo, .roundfour, .roundsix{
            background-color: blanchedalmond;
            border: 2px solid black;
            border-radius: 5px;
        }

    </style>
</head>

<body>
    <header>
        <nav class="oneoone">
            <img height="100px" width="200px" src="the-trees-svgrepo-com.svg" alt="logo">

        </nav>
        <section>
            <h1 class="one" style=text-align:center;>SIGNUP</h1>
            <div>
                <form action="signup" method="post">
                    <div class="two">
                        <label class="roundone" for "email"> Email : </label><br>
                        <input class="roundtwo" type="text" id="email" name="email" placeholder="enter email"><br>
                    </div>
                    <div class="three">
                        <label class="roundthree" for "pass"> Password : </label><br>
                        <input class="roundfour" type="password" id="pass" name="password" placeholder="enter password">
                    </div>
                    <div class="four">
                        <label class="roundfive" for "pass"> Confirm Password : </label><br>
                        <input class="roundsix" type="password" id="pass" name="password"
                            placeholder="enter confirm password">
                    </div>
            </div>
            <div class="five" style="text-align: center;">
                <a style="color:rgba(59, 67, 41, 0.466);" href="01-html-sign-in.html">SIGNUP</a>

            </div>
            </form>
        </section>
        <footer class="six" style="text-align: center;">
            <a class="six_one" href="link">ABOUT US</a>
            &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;

        </main>
