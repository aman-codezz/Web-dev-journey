<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Jost:ital,wght@0,100..900;1,100..900&display=swap"
        rel="stylesheet">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet">
</head>

<body>
    <aside>
        <div id="top">
            <div>
                <h1 id="logo">B</h1>
                <h2>Billora</h2>
            </div>
            <div id="workspace-switcher">
                <div id="workspace-mono">SN</div>
                <div class="comp-name">
                    <h3>Studio North</h3>
                    <p>Pro workspace</p>
                </div>
            </div>
            <div id="main-nav">
                <div id="overview" class="active">
                    <div class="logo"><img src="Assets/overview.png" alt="logo"></div>
                    <div class="item">Overview</div>
                </div>
                <div id="invoices" class="active">
                    <div class="logo"><img src="Assets/invoice.png" alt="logo"></div>
                    <div class="item">Invoices</div>
                </div>
                <div id="clients" class="active">
                    <div class="logo"><img src="Assets/client.png" alt="logo"></div>
                    <div class="item">Clients</div>
                </div>
                <div id="projects" class="active">
                    <div class="logo"><img src="Assets/project.png" alt="logo"></div>
                    <div class="item">Projects</div>
                </div>
                <div id="payments" class="active">
                    <div class="logo"><img src="Assets/payment.png" alt="logo"></div>
                    <div class="item">Payments</div>
                </div>
            </div>
        </div>
        </div>
        <div id="bottom">
            <div id="settings">
                <div class="logo">⚙</div>
                <div class="item">Settings</div>
            </div>
            <div id="help">
                <div class="logo">ⓘ</div>
                <div class="item">Help & resources</div>
            </div>
            <div id="name">
                <div class="logo">AC</div>
                <div class="item">
                    <h3>Alex Carter</h3>
                    <p>Workspace Owner</p>
                </div>
            </div>
        </div>

    </aside>
    <script src="script.js"></script>
</body>

</html>
