<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>New layout</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        body {
            background-image: url("blackout.jpg.jpg");
        }

        ul {
            border: 2px solid black;
            list-style-type: none;
            display: flex;
            height: 10vh;
            flex-flow: row wrap;
            justify-content: flex-end;
            align-items: center;
            gap: 10px 20px;
            padding-right: 5px;
            position: relative;
            background-color: rgba(255, 255, 255, 0.39);
        }

        .logo {
            width: 23px;
            height: 23px;
            align-self: center;
            position: absolute;
            left: 1vmin;
        }

        section {
            border: 1px solid black;
            height: 50vh;
            background-color: rgba(240, 248, 255, 0.345);
            display: flex;
            flex-flow: row wrap;
            justify-content: space-around;
            align-items: center;
            gap: 10px 20px;
            margin-top: 178px;
        }
        .box1, .box2, .box3{
            border: 2px solid black;
            width: 25vw;
            height: 20vh;
            align-self: center;
            justify-self: center;
        }
        .box1 img, .box2 img, .box3 img{
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body>
    <header>
        <nav>
            <ul>
                <img class="logo" src="buisness_logo.jpg" alt="logo">
                <li>Home</li>
                <li>Contact</li>
                <li>More</li>
                <li>About</li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <div class="box1">
                <img src="blackout.jpg.jpg" alt="">
            </div>
            <div class="box2">
                <img src="image.jpg.jpg" alt="">
            </div>
            <div class="box3">
                <img src="bridge-sea-middle-mountains.jpg" alt="">
            </div>
        </section>
    </main>
</body>

</html>
