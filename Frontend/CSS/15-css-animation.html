<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Animaton</title>
    <style>
        .container{
            background-color: aquamarine;
            height: 100vh;
            width:100vw;
        }
        .image{
            height: 20vh;
            width: 10vw; 
             animation: amananimation 20s linear 1ms infinite alternate ;
             ; 
        }
        .image img{
            object-fit: cover;
            height: 100%;
            width: 100%;
        }
        @keyframes amananimation{
            from{
                transform: translateX(0%);
            }
            to{
                transform: translateX(100vmax);
            }
        }
        @keyframes animation2 {
            
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="image"><img src="aeroplane-svg.svg"></div>
    </div>
    
</body>
</html>
