<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-1</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        header{
            position:sticky;
            top:0;
        }
        nav{
           box-shadow: 0px 2px 1px rgb(60, 57, 57);
           background-color:lightblue;
           border:1.5px solid black;
           display:grid;
           height: 10vh;
           grid-template-columns: repeat(3, 1fr);
           grid-template-rows: 1fr; 
           justify-items: center;
           align-items: center;
           
        }
        .container{
            margin: 10px;
            border:0px solid black;
            height: 100vh;
            display:grid;
            grid-template-columns: 10vw repeat(2, 1fr);
            grid-template-rows: 1fr 1fr;
            gap: 10px;
            /* justify-items: center; */
            /* align-items: center; */
        }
        .item{
            border: 1px solid black;
            box-shadow: 2px 2px 1px rgb(60, 57, 57)
        }
        .item-1{
            box-shadow: 2px 0px 1px rgb(60, 57, 57);
            margin-top:-10px;
            margin-bottom:-8px;
            margin-left: -10px;
            border: 1px solid black;
            grid-column: 1/2;
            grid-row: 1/3;
            overflow: hidden;
        }
        .item-2{
            grid-column: 2/4;
            grid-row: 1/2;
            border: 1px solid black;
        }
        .item-3{
            grid-column: 2/4;
            grid-row: 2/3;
            border: 1px solid black;
            text-align: center;

        }
        footer{
            box-shadow: 0px -2px 1px rgb(60, 57, 57);
            border:1px solid black;
            display:grid;
            height: 30px;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: 1fr; 
            justify-items:center;
            align-items: center;
            height:10vh;
        }

    </style>
</head>
<body>
    <header><nav>
        <li>grid1</li>
        <li>grid2</li>
        <li>grid3</li>
    </nav></header>
    <main>
        <section class="container">
            <h1 class="item-1 item">Grid 1</h1>
            <p class="item-2 item">This is the first grid.</p>
            <aside class="item-3 item">This is the first aside.</aside>
        </section>
    </main>
    <footer>
        <li>Copyright &copy; 2024</li>
        <li><a href="link">Link 1</a></li>
        <li><a href="link">Link 2</a></li>
    </footer>
</body>                                                                                 
</html>
