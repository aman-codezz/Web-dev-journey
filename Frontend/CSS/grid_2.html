<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>grid-2</title>
    <style>
        *{
            margin:0;
            padding:0;
        }
        body{
           background-image: url("wllpr-desktop-4k (1).jpg");
           background-size: cover;
           display:grid;
           grid-auto-columns: auto;
           grid-auto-rows: auto;
            grid-template-areas:"item-1 item-1 item-1"
                                "item-2 item-3 item-3"
                                "item-2 item-3 item-3"
                                "item-2 item-3 item-3"
                                "item-2 item-4 item-5"
                                "item-2 item-4 item-6"
                                "item-7 item-7 item-7";
            height:100vh;
            gap:10px;
        }
        .item{
            opacity: 0.8;
            box-shadow: 2px 2px 1px rgb(60, 57, 57);
            border-radius: 5px;
            border:1px solid rgb(151, 143, 143);
            background-color: rgba(64, 62, 62, 0.91);
        }
        .item-1{
            text-align:center;
            grid-area: item-1;
        }
        .item-2{
            text-align:center;
            grid-area: item-2;
        }   
        .item-3{
            text-align:center;
            grid-area: item-3;
        }
        .item-4{
            text-align:center;
            grid-area: item-4;
        }
        .item-5{
            text-align:center;
            grid-area: item-5;
        }
        .item-6{
            text-align:center;
            grid-area: item-6;
        }
        .item-7{
            box-shadow: 2px -2px 1px rgb(60, 57, 57);
            text-align:center;
            grid-area: item-7;
            /* height: 10vh; */
        }
    </style>
</head>
<body>
    <div class="item-1 item">1</div>
    <div class="item-2 item">2</div>
    <div class="item-3 item">3</div>
    <div class="item-4 item">4</div>
    <div class="item-5 item">5</div>
    <div class="item-6 item">6</div>
    <div class="item-7 item">7</div>
</body>
</html>
