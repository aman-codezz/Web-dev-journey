<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Layout</title>
    <style>
        *{
            margin:0;
            padding: 0;
        }
        ::selection{
            color: rgb(2, 137, 255);
            background-color: black;
        }
        ul{
            border:2px solid black;
            list-style-type: none;
            display: flex;
            justify-content: space-around;
            align-items: center;
            flex-flow: row wrap;
            row-gap: 10px;
            height: 10vh;
        }
        main{
            margin-top: 50px;
            justify-content: center;
            align-content: center;
            display: flex;
            border: 1px solid black;

        }
        .image{
            border: 2px solid black;
            width: 100vw;
            height: 50vh;
            align-self:flex-start;
        }
        img{
            object-fit: cover;
            width: 100%;
            height: 100%;
        }
        .content{
            align-self:center;
            padding: 10px;
        }

    </style>
</head>

<body>
    <header>
        <nav>
            <ul>
                <li>Home</li>
                <li>Contact</li>
                <li>More</li>
                <li>About</li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="image">
            <img src="blackout.jpg.jpg" alt="">
        </div>
        <div class="content">
            <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Sequi quas numquam accusantium deserunt vitae?
            Tempora amet voluptatum quasi exercitationem corporis illo voluptates aut dolores, accusantium esse labore
            culpa facilis atque.</p>
        </div>
    </main>
   
</body>

</html>
