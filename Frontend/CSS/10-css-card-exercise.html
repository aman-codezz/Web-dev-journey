<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card</title>
</head>
<style>
    section {
        box-shadow: 10px 10px 5px ;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: grey;
        border: 2px solid;
        border-radius: 6px;
        width: 60vmin;
        margin: 50px auto;
        height: auto;
        position: relative;
        
    }

    .main {
        margin: 5px;
        padding: 5px;
    }

    .image {
        text-align: center;
        border-radius: 6px;
        width: 100%;
        position: relative;
        top: -0.3vmin;
        margin: 0px auto;
        height: 60vh;
        overflow: hidden;
    }
    .image img{
        width: 100%;
        height: 100%;
        object-fit: cover;
        border-radius: 6px;
    }

    .capsule1 {
        background-color: rgb(223, 220, 220);
        color: rgb(111, 111, 241);
        margin-top: 5px;
        padding: 5px;
        display: inline-block;
        border: 1px solid rgb(111, 111, 241);
        border-radius: 12px;
        transition: all 1s ease 10ms;
    }
    .capsule1:hover{
        font-weight: 500;
        background-color: black;
        transform: scale(1.15);
    }

    .capsule2 {
        background-color: rgb(223, 220, 220);
        color: rgb(111, 111, 241);
        padding: 5px;
        display: inline-block;
        border: 1px solid rgb(111, 111, 241);
        border-radius: 12px;
        transition: all 1s ease 10ms;
    }
     .capsule2:hover{
        font-weight: 500;
        background-color: black;
        transform: scale(1.15);
    }

    h2 {
         color: rgb(91, 89, 89);
    }
    .more_main{
        text-align: center;
    }
    .more{
        cursor:pointer;
        background-color: rgb(223, 220, 220);
        color: rgb(111, 111, 241);
        font-weight: 600;
        text-align: center;
        border: 2px solid rgb(111, 111, 241);
        padding: 5px;
        width: 20vmin;
        margin: 10px auto;
        border-radius: 20px;
        box-shadow: 3px 2px 2px rgb(111, 111, 241);
        transition: all 100ms ease 0.1ms;
    }
    .more:active{
        transform:scale(1.1, 1.1 );
        background-color: rgb(29, 33, 33);
    }
    /* .more:hover{
        transform:scale(1.1, 1.1 );
    } */
</style>

<body>
    <section class="main_box">
        <div class="main">
            <div class="image">
                <img src="blackout.jpg.jpg" alt="image">
            </div>
            <div class="capsule1">
                Photo
            </div>
            <div class="capsule2">
                Blackout
            </div>
            <h2>
                About this image
            </h2>
            <div class="paragraph">Lorem ipsum dolor, sit amet consectetur adipisicing elit. Labore nobis magni
                accusamus
                distinctio aperia.
            </div>
               <div class="more_main">
                <button class="more">
                    Read More
                </button>
                </div>
        </div>
    </section>

</body>

</html>
