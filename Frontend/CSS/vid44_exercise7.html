<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Download Ultra</title>
    <style>
         @media only screen and (min-width:758px) {

        .container {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            grid-template-rows: repeat(3, 1fr);
            gap: 10px;
            /* border:none; */
            justify-content: center;
            align-content: center;
            height: 100vh;
            width: 100vw;
        }

        .item {
            background-color: rgb(232, 229, 229);
            border:none;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, 1fr);
            /* grid-template-areas:"h3 h4" */
                                /* "button1 button2 " ; */
            justify-items:center;
            align-items: center;

        }
        h3{
            grid-column: 1/3;
            grid-row: 1/2;
            align-self: end;
            margin-bottom: 0px;
        }
        h4{
            margin-top: 0px;
            grid-column:1/3;
            align-self:start;
            grid-row: 2/3;
        }
        .button1{
            cursor: pointer;
            background-color: yellow;
            padding:10px;
            border-radius: 4px;
            border:none;
            grid-column: 1/2;
            grid-row: 3/4;
        }
        .button2{
            cursor:pointer;
            background-color: greenyellow;
            padding:10px;
            border-radius: 4px;
            border:none;
            grid-column: 2/3;
            grid-row: 3/4;
        }
        .item1 {
            grid-column: 1/2;
            grid-row: 1/2;

        }

        .item2 {
            grid-column: 2/3;
            grid-row: 1/2;
        }

        .item3 {
            grid-column: 3/4;
            grid-row: 1/2;
        }

        .item4 {
            grid-column: 1/2;
            grid-row: 2/3;
        }

        .item5 {
            grid-column: 2/3;
            grid-row: 2/3;
        }

        .item6 {
            grid-column: 3/4;
            grid-row: 2/3;
        }

        .item7 {
            grid-column: 1/2;
            grid-row: 3/4;
        }

        .item8 {
            grid-column: 2/3;
            grid-row: 3/4;
        }

    } 
    @media only screen and (max-width:500px){
         .container {
            display: grid;
            grid-template-columns: 1fr;
            /* grid-template-rows: repeat(8, 1fr); */
            gap: 10px;
            justify-content: center;
            align-content: center;
            min-height: 100vh;
            width: 100vw;
        }
        
        .item {
            background-color: rgb(232, 229, 229);
            border:none;
            border-radius: 4px;
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            grid-template-rows: repeat(3, auto);
            justify-items:center;
            align-items: center;
            grid-column: 1 / 2;

        }
        h3{
            grid-column: 1/3;
            grid-row: 1/2;
            align-self: end;
            margin-bottom: 0px;
        }
        h4{
            margin-top: 0px;
            grid-column:1/3;
            align-self:start;
            grid-row: 2/3;
        }
        .button1{
            cursor: pointer;
            background-color: yellow;
            padding:10px;
            border-radius: 4px;
            border:none;
            grid-column: 1/2;
            grid-row: 3/4;
        }
        .button2{
            cursor:pointer;
            background-color: greenyellow;
            padding:10px;
            border-radius: 4px;
            border:none;
            grid-column: 2/3;
            grid-row: 3/4;
        }
        .item1 { grid-row: 1 / 2; }
        .item2 { grid-row: 2 / 3; }
        .item3 { grid-row: 3 / 4; }
        .item4 { grid-row: 4 / 5; }
        .item5 { grid-row: 5 / 6; }
        .item6 { grid-row: 6 / 7; }
        .item7 { grid-row: 7 / 8; }
        .item8 { grid-row: 8 / 9; }

    }
    </style>
</head>
