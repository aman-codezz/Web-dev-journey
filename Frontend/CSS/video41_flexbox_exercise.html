<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NAV abr</title>
    <style>
        nav {
            background-color: rgba(237, 232, 232, 0.266);
            height: 11vh;
            border: 1px solid black;
            border-radius: 2px;
            display: flex;
            flex-flow: row wrap;
            justify-content: space-around;
            align-items: center;
        }

        ol {

            display: flex;
            width: 50vw;
            justify-content: space-around;
            align-items: center;
            justify-content: space-around;
            align-items: center;
        }

        .image1 {
            height: 40px;
            width: 110px;
        }

        .image1 img {
            object-fit: cover;
            height: 100%;
            width: 100%;
        }

        nav li {
            list-style-type: none;
            padding: 10px;
            font-size: 1em
        }

        .button1 {
            background-color:rgb(236, 202, 11);
            border: none;
            border-radius:4px ;
            justify-self: center;
            justify-self: center;
            padding: 10px;
            /* width: 10vw; */
            font-size: 18px;
            margin-left: 30px;
            margin: 10px;
        }

        .button2 {
             border: none;
            border-radius:4px ;
            justify-self: center;
            justify-self: center;
            padding: 10px;
            /* width: 10vw; */
            font-size: 18px;
            margin-right: 30px;
            margin: 10px;
        }
        .button:hover{
            opacity: 0.4;
            border:1px solid black;
            cursor: pointer;
        }
        ol li:hover{
            border: 0.5px solid black;
            border-radius: 3px;
           background-color: rgb(245, 242, 242);
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <div class="image1">
                <img src="ss_logo.jpg" alt="logo">
            </div>
            <ol>
                <li>Product</li>
                <li>Buy</li>
                <li>Renew</li>
                <li>Support</li>
                <li>Learn</li>
                <li>Company</li>
            </ol>
            <button class="button1 button">Download</button>
            <button class="button2 button">language</button>
        </nav>
    </header>

</body>

</html>
